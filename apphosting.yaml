# Firebase App Hosting config (runs the Next.js app on Cloud Run).
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0   # scale to zero, free when idle
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GCP_PROJECT_ID
    value: omiryn
  - variable: VERTEX_REGION
    value: global
  - variable: CLAUDE_MODEL
    value: claude-sonnet-5
  # Firebase web config is public; needed at build time for the browser bundle.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDjrGuTPFesXtnsgenKYXrtm2SdCal1BxA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: omiryn.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:66496865626:web:e00c2f1879836a10717f63"
    availability: [BUILD, RUNTIME]
  # Instagram (Phase 2). Set APP_URL and INSTAGRAM_APP_ID once the backend URL and Meta app exist.
  - variable: APP_URL
    value: REPLACE_WITH_APP_HOSTING_URL
  - variable: INSTAGRAM_APP_ID
    value: REPLACE_WITH_INSTAGRAM_APP_ID
  - variable: INSTAGRAM_APP_SECRET
    secret: dealdost-instagram-app-secret
  - variable: TOKEN_ENCRYPTION_KEY
    secret: dealdost-token-encryption-key
